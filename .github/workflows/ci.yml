name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Lint - ESLint and Prettier
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Fix Prettier formatting
        run: pnpm run format

      - name: Commit formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "style: auto-fix prettier formatting" && git push)

  # Job 2: Test - Jest with coverage (parallel, non-blocking)
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=6144'
          PORT: 3000
          APP_NAME: NestJS Ecommerce Platform Test
          ACCESS_TOKEN_SECRET: test_access_token_secret_min_32_chars_ci
          ACCESS_TOKEN_EXPIRES_IN: 15m
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_min_32_chars_ci
          REFRESH_TOKEN_EXPIRES_IN: 7d
          PAYMENT_API_KEY: test_payment_api_key_ci
          ADMIN_NAME: Admin
          ADMIN_PASSWORD: test_admin_password_ci
          ADMIN_EMAIL: admin@test.example.com
          ADMIN_PHONENUMBER: '0000000000'
          OTP_EXPIRES_IN: 5m
          RESEND_API_KEY: re_test_resend_api_key_ci
          GOOGLE_CLIENT_ID: test_google_client_id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test_google_client_secret_ci
          GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
          GOOGLE_CLIENT_REDIRECT_URI: http://localhost:3300/oauth-google-callback
          PREFIX_STATIC_ENDPOINT: http://localhost:3000/media/static
          S3_REGION: ap-southeast-1
          S3_ACCESS_KEY_ID: test_aws_access_key_id_ci
          S3_SECRET_ACCESS_KEY: test_aws_secret_access_key_ci
          S3_BUCKET_NAME: test-bucket-name-ci
          ANTHROPIC_API_KEY: test_anthropic_api_key_ci
          MUX_TOKEN_ID: test_mux_token_id_ci
          MUX_TOKEN_SECRET: test_mux_token_secret_ci
          MUX_WEBHOOK_ENDPOINT: test_mux_webhook_endpoint_ci
          MUX_SIGNING_SECRET: test_mux_signing_secret_ci
        run: pnpm run test:cov -- --runInBand

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Job 3: E2E and Integration Tests — runs after unit tests pass
  e2e:
    name: E2E & Integration Tests
    runs-on: ubuntu-latest
    needs: [test]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: npx prisma generate

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: npx prisma migrate deploy

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=6144'
          PORT: 3000
          APP_NAME: NestJS Ecommerce Platform Test
          ACCESS_TOKEN_SECRET: test_access_token_secret_min_32_chars_ci
          ACCESS_TOKEN_EXPIRES_IN: 15m
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_min_32_chars_ci
          REFRESH_TOKEN_EXPIRES_IN: 7d
          PAYMENT_API_KEY: test_payment_api_key_ci
          ADMIN_NAME: Admin
          ADMIN_PASSWORD: test_admin_password_ci
          ADMIN_EMAIL: admin@test.example.com
          ADMIN_PHONENUMBER: '0000000000'
          OTP_EXPIRES_IN: 5m
          RESEND_API_KEY: re_test_resend_api_key_ci
          GOOGLE_CLIENT_ID: test_google_client_id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test_google_client_secret_ci
          GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
          GOOGLE_CLIENT_REDIRECT_URI: http://localhost:3300/oauth-google-callback
          PREFIX_STATIC_ENDPOINT: http://localhost:3000/media/static
          S3_REGION: ap-southeast-1
          S3_ACCESS_KEY_ID: test_aws_access_key_id_ci
          S3_SECRET_ACCESS_KEY: test_aws_secret_access_key_ci
          S3_BUCKET_NAME: test-bucket-name-ci
          ANTHROPIC_API_KEY: test_anthropic_api_key_ci
          MUX_TOKEN_ID: test_mux_token_id_ci
          MUX_TOKEN_SECRET: test_mux_token_secret_ci
          MUX_WEBHOOK_ENDPOINT: test_mux_webhook_endpoint_ci
          MUX_SIGNING_SECRET: test_mux_signing_secret_ci
        run: pnpm run test:e2e

      - name: Run Integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          DIRECT_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=6144'
          PORT: 3000
          APP_NAME: NestJS Ecommerce Platform Test
          ACCESS_TOKEN_SECRET: test_access_token_secret_min_32_chars_ci
          ACCESS_TOKEN_EXPIRES_IN: 15m
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_min_32_chars_ci
          REFRESH_TOKEN_EXPIRES_IN: 7d
          PAYMENT_API_KEY: test_payment_api_key_ci
          ADMIN_NAME: Admin
          ADMIN_PASSWORD: test_admin_password_ci
          ADMIN_EMAIL: admin@test.example.com
          ADMIN_PHONENUMBER: '0000000000'
          OTP_EXPIRES_IN: 5m
          RESEND_API_KEY: re_test_resend_api_key_ci
          GOOGLE_CLIENT_ID: test_google_client_id.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test_google_client_secret_ci
          GOOGLE_REDIRECT_URI: http://localhost:3000/auth/google/callback
          GOOGLE_CLIENT_REDIRECT_URI: http://localhost:3300/oauth-google-callback
          PREFIX_STATIC_ENDPOINT: http://localhost:3000/media/static
          S3_REGION: ap-southeast-1
          S3_ACCESS_KEY_ID: test_aws_access_key_id_ci
          S3_SECRET_ACCESS_KEY: test_aws_secret_access_key_ci
          S3_BUCKET_NAME: test-bucket-name-ci
          ANTHROPIC_API_KEY: test_anthropic_api_key_ci
          MUX_TOKEN_ID: test_mux_token_id_ci
          MUX_TOKEN_SECRET: test_mux_token_secret_ci
          MUX_WEBHOOK_ENDPOINT: test_mux_webhook_endpoint_ci
          MUX_SIGNING_SECRET: test_mux_signing_secret_ci
        run: pnpm run test:integration

  # Job 4: Build source code
  build:
    name: Build Source Code
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npx prisma generate

      - name: Build
        run: pnpm run build
